# Quick arm64 build of the own-engine branch. Uses no signing secrets (debug-signed) and can never
# publish a release: it only uploads the APK as a workflow artifact.
name: Own engine (dev build)

on:
  push:
    branches: [own-engine]
  workflow_dispatch:

permissions:
  contents: write   # only to commit a refreshed pubspec.lock back to the branch

concurrency:
  group: own-engine-dev
  cancel-in-progress: true

jobs:
  build:
    name: arm64 dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg build (arm64)
        id: ffcache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/cpp/ffmpeg
          key: ffmpeg-dev-n7.1-api24-arm64-${{ hashFiles('scripts/build_ffmpeg.sh') }}

      - name: Build FFmpeg (decode-only, arm64-v8a)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg.sh arm64-v8a

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Commit refreshed pubspec.lock (media_kit removed)
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            git config user.name "own-engine-bot"
            git config user.email "own-engine-bot@users.noreply.github.com"
            git add pubspec.lock
            git commit -m "chore: refresh pubspec.lock after removing media_kit [skip ci]"
            git push
          fi

      - name: Build release APK (arm64)
        env:
          ABI_FILTER: arm64-v8a
        run: |
          set +e
          VER=$(cut -d+ -f1 version.txt | tr -d '[:space:]')
          flutter build apk --release --target-platform android-arm64 --dart-define=APP_VERSION="$VER" 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            { grep -n -E "^e: |error:|Error:|FAILURE|What went wrong|Execution failed|CMake|ninja:|undefined reference|fatal error|Unresolved|Could not" /tmp/build.log | head -30; tail -15 /tmp/build.log; } | while IFS= read -r l; do echo "::error::${l:0:480}"; done
          fi
          exit $code

      - name: Check the native engine is inside the APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -Z1 "$APK" 'lib/*' | sort
          mkdir -p /tmp/apk && unzip -q -o "$APK" 'lib/arm64-v8a/libswdecode.so' -d /tmp/apk
          size=$(stat -c%s /tmp/apk/lib/arm64-v8a/libswdecode.so)
          echo "libswdecode.so = $size bytes"
          echo "libswdecode.so arm64: $size bytes (stub is ~tens of KB, with FFmpeg linked it is MBs)" >> "$GITHUB_STEP_SUMMARY"
          [ "$size" -gt 400000 ] || { echo "::error::libswdecode.so is only $size bytes: FFmpeg was not linked (stub build)"; exit 1; }
          if unzip -Z1 "$APK" 'lib/*' | grep -qi 'mpv\|ffmpeg\|media_kit'; then echo "::error::old libmpv/ffmpeg libraries are still packaged"; unzip -Z1 "$APK" 'lib/*' | grep -i 'mpv\|ffmpeg\|media_kit'; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: own-engine-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
