# DEV REPO: edit and test here first. Publish to the public repo (mounsokdara/video-player) only after the dev run passes.
name: Dev Test

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          grep -E '^\s*(error|warning) ' analyze.txt | head -60 | while read -r line; do
            echo "::error::$(echo "$line" | cut -c1-300)"
          done
          if [ $code -ne 0 ] && ! grep -qE '^\s*(error|warning) ' analyze.txt; then
            echo "::error::$(tail -c 500 analyze.txt | tr '\n' ' ')"
          fi
          exit $code
      - run: flutter test
        if: hashFiles('test/**') != ''

  build-apk:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KS_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing: dev APK would not match the release signature"; exit 1; }
          echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
      - name: Build release APK
        run: |
          set +e
          VER=$(cut -d+ -f1 version.txt | tr -d '[:space:]')
          flutter build apk --release --dart-define=APP_VERSION="$VER" 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -n -E "^e: |error:|FAILURE|What went wrong|Execution failed|AAPT|not found|Unresolved|Could not" /tmp/build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:480}"; done
            grep -n -A6 "What went wrong" /tmp/build.log | head -12 | while IFS= read -r l; do echo "::error::${l:0:480}"; done
          fi
          exit $code
      - name: Verify APK version matches version.txt
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          want_name=$(cut -d+ -f1 version.txt | tr -d '[:space:]')
          want_code=$(cut -d+ -f2 version.txt | tr -d '[:space:]')
          out=$("$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -m1 "^package:")
          echo "$out"
          echo "$out" | grep -q "versionName='$want_name'" && echo "$out" | grep -q "versionCode='$want_code'" || { echo "::error::APK version does not match version.txt ($want_name+$want_code)"; exit 1; }
      - name: Sign + verify APK (apksigner v1/v2/v3)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUTDIR=build/app/outputs/flutter-apk
          KS_FILE=android/app/upload-keystore.jks bash scripts/sign-apk.sh "$OUTDIR/app-release.apk" "$OUTDIR/app-release-signed.apk" | tee sign.log
          # Public release key fingerprint (from the private vault). The dev APK must carry the same one.
          WANT=fd5c65cc4aba8e32aea3182b5ab8ebc4c0b52e9f0861a8dfca721d02c71b7db6
          grep -q "signed with the expected key ($WANT)" sign.log || { echo "::error::dev APK is not signed with the release key"; exit 1; }
          mv -f "$OUTDIR/app-release-signed.apk" "$OUTDIR/app-release.apk"
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/com.mounsokdara.video_player.dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: video-player-dev-apk
          path: build/app/outputs/flutter-apk/com.mounsokdara.video_player.dev.apk
          if-no-files-found: error
          retention-days: 14
