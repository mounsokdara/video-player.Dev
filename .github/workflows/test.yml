# DEV REPO: edit and test here first. Publish to the public repo (mounsokdara/video-player) only after the dev run passes.
name: Dev Test

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
        if: hashFiles('test/**') != ''

  build-apk:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/com.mounsokdara.video_player.dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: video-player-dev-apk
          path: build/app/outputs/flutter-apk/com.mounsokdara.video_player.dev.apk
          if-no-files-found: error
          retention-days: 14
