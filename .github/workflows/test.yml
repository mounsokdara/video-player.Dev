# DEV REPO: edit and test here first. Publish to the public repo (mounsokdara/video-player) only after the dev run passes.
name: Dev Test

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --format=machine > analyze.txt 2>&1
          code=$?
          grep -E '^(ERROR|WARNING)\|' analyze.txt | head -30 | while IFS='|' read -r sev type code2 file line col len msg; do
            echo "::error file=$file,line=$line::$sev $type: $msg"
          done
          [ -s analyze.txt ] && [ $code -ne 0 ] && [ -z "$(grep -E '^(ERROR|WARNING)\|' analyze.txt)" ] && echo "::error::$(head -c 400 analyze.txt | tr '\n' ' ')"
          exit $code
      - run: flutter test
        if: hashFiles('test/**') != ''

  build-apk:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
          fi
      - run: flutter build apk --release
      - name: Sign + verify APK (apksigner v1/v2/v3)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -f android/key.properties ]; then
            OUTDIR=build/app/outputs/flutter-apk
            KS_FILE=android/app/upload-keystore.jks bash scripts/sign-apk.sh "$OUTDIR/app-release.apk" "$OUTDIR/app-release-signed.apk"
            mv -f "$OUTDIR/app-release-signed.apk" "$OUTDIR/app-release.apk"
          fi
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/com.mounsokdara.video_player.dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: video-player-dev-apk
          path: build/app/outputs/flutter-apk/com.mounsokdara.video_player.dev.apk
          if-no-files-found: error
          retention-days: 14
